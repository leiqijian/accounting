spring:
  application:
    name: service-accounting-worker
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        enabled: true
        username: nacos
        password: nacos
        server-addr: ${LIQUIDO_DISCOVER}
        namespace: ${spring.profiles.active}
      config:
        file-extension: yaml
        group: DEFAULT_GROUP
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: ${spring.profiles.active}
    sentinel:
      transport:
        dashboard: ${LIQUIDO_SENTINEL}